# Publicar: monta o site (front e Storybook) com o último pacote de dados públicos e põe no GitHub Pages.
# Não coleta nem processa nada (D42): roda depois do processar. Mudança só de tela vai ao ar sem reprocessar.
#
# Só publica com a variável de repositório PUBLICAR_PAGES = true (Settings > Variables). O pacote já saiu
# em modo público e passou pela conferência de dados sensíveis no processar (D40).
name: publicar

on:
  workflow_run:
    workflows: [processar]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    if: >-
      vars.PUBLICAR_PAGES == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Último pacote de dados públicos
        id: pacote
        uses: actions/cache/restore@v5
        with:
          path: pacote
          key: pacote-${{ github.run_id }}
          restore-keys: pacote-

      - name: Sem pacote no cache, nada a publicar
        if: steps.pacote.outputs.cache-matched-key == ''
        run: |
          echo "Sem pacote de dados: rode o processar primeiro." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Front estático
        working-directory: front
        run: npm ci && npm run build:estatico

      # o design system (Storybook) vai junto, em /storybook/; depois do front, que esvazia site/
      - name: Design system
        working-directory: front
        run: npm run build-storybook -- -o ../site/storybook

      - name: Dados
        run: |
          cp -R pacote site/data
          echo "Site do commit $(git rev-parse --short HEAD) com o pacote de dados do commit $(cut -c1-7 pacote/commit.txt)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
