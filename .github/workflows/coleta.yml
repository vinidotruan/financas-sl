# Coleta diária, banco, exportação em modo público e (se ligado) publicação no GitHub Pages.
#
# Dados entre execuções: ficam no cache do Actions (data/), não numa release. O raw do PNCP traz CPF
# inteiro de fornecedor pessoa física; uma release ficaria pública se o repositório ficar público, o
# cache não (só os workflows deste repositório leem). Ver D31 em docs/decisoes.md.
#
# Publicação: só acontece com a variável de repositório PUBLICAR_PAGES = true (Settings > Variables).
# O site sai sempre em modo público, com a revisão de config/revisao-publica.json (sem notas).
name: coleta

on:
  schedule:
    - cron: "10 9 * * *"   # 06:10 em Brasília. O cron do Actions pode atrasar.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SLF_REVISAO: config/revisao-publica.json
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Dados da última execução (banco e última coleta boa de cada fonte)
        uses: actions/cache/restore@v5
        with:
          path: data
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - run: uv sync --locked

      - name: Coletar e montar o banco
        run: uv run slf diario

      - name: Podar coletas antigas
        if: always()
        run: uv run slf podar --manter 2

      - name: Guardar dados para a próxima execução
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data
          key: dados-${{ github.run_id }}

      - name: Front estático
        working-directory: front
        run: npm ci && npm run build:estatico

      # o design system (Storybook) vai junto, em /storybook/; depois do front, que esvazia site/
      - name: Design system
        working-directory: front
        run: npm run build-storybook -- -o ../site/storybook

      - name: Exportar em modo público
        run: uv run slf exportar --modo publico --saida site/data

      # D40: nada que pareça dado sensível vai ao ar. Achou, a publicação para e o site fica como estava;
      # o relatório mostra só a forma do trecho (o log é público). Falso positivo: config/sensivel-liberados.yaml
      - name: Conferir dados sensíveis
        run: |
          if ! uv run slf conferir --pasta site/data > conferencia.txt; then
            { echo '### Publicação parada: dado sensível no export (D40)'; echo '```'; cat conferencia.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat conferencia.txt
            exit 1
          fi
          cat conferencia.txt

      - name: Resumo
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run slf status >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        if: vars.PUBLICAR_PAGES == 'true'
        with:
          path: site

  publicar:
    needs: coletar
    if: vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
