# Coletar: baixa os dados brutos de todas as fontes e guarda no cache do Actions. Só isso (D42).
# Depois dela vêm, encadeados, o processar (processar.yml: banco, regras, exportação pública e
# conferência) e o publicar (publicar.yml: site no GitHub Pages).
#
# Dados entre execuções: ficam no cache do Actions (data/), não numa release. O raw do PNCP traz CPF
# inteiro de fornecedor pessoa física; só os workflows deste repositório leem o cache. Ver D31.
name: coleta

on:
  schedule:
    - cron: "10 9 * * *"   # 06:10 em Brasília. O cron do Actions pode atrasar.
  workflow_dispatch:
    inputs:
      fontes:
        description: "Fontes separadas por espaço, para coletar só algumas (vazio: todas)"
        required: false
        default: ""

permissions:
  contents: read

# o mesmo grupo do processar: nunca processa enquanto a coleta ainda grava no cache
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dados da última execução (última coleta boa de cada fonte)
        uses: actions/cache/restore@v5
        with:
          path: data
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - run: uv sync --locked

      # Fonte fora do ar não segura as outras: o processar usa a última coleta boa dela.
      - name: Coletar
        continue-on-error: true
        env:
          FONTES: ${{ inputs.fontes }}
        run: uv run slf coletar $FONTES

      - name: Podar coletas antigas
        if: always()
        run: uv run slf podar --manter 2

      - name: Guardar dados para o processar e a próxima coleta
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data
          key: dados-${{ github.run_id }}
