[project]
name = "financas-sl"
version = "0.1.0"
description = "Coleta e sinais de risco das finanças de São Leopoldo (fase 1)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
slf = "slf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slf"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
