id: R02
nome: Dinheiro de emenda parado
versao: 2
area: emendas
severidade: atencao
base_legal: TCU, auditorias de transferências especiais (recursos parados de 6 a 12 meses)
limiar: >
  transferido há mais de 180 dias e o último relatório de gestão entregue mostra menos de 10%
  executado. Plano sem relatório entregue não entra aqui (sem relatório não quer dizer 0%); ele é
  coberto pela R03.
pode_ser_normal_se: >
  Projeto e licitação de obra são lentos, houve a enchente de maio de 2024, ou o relatório
  de gestão está atrasado em relação ao gasto real. Na fase 2 o portal da prefeitura
  mostra o empenhado e o pago de verdade.
como_verificar: Cronograma do plano de trabalho e situação das licitações ligadas à emenda.
observado: {rotulo: Executado segundo o último relatório, formato: pct}
resumo: "O relatório {ultimo_relatorio} de {data_relatorio|data} mostra {executado_relatorio|brl} executados de {transferido|brl} transferidos, {dias_desde_a_transferencia} dias depois da transferência."
fontes: [transferegov]
sql: |
  select codigo_emenda || '/' || id_plano_acao as chave,
         codigo_formatado || ' · ' || parlamentar as titulo,
         executado_relatorio / transferido as valor_observado,
         struct_pack(transferido := transferido, executado_relatorio := executado_relatorio,
                     ultimo_relatorio := tipo_relatorio, data_relatorio := data_relatorio,
                     primeira_transferencia := primeira_ob, dias_desde_a_transferencia := current_date - primeira_ob,
                     situacao_plano_trabalho := situacao_plano_trabalho,
                     id_plano_acao := id_plano_acao) as evidencia,
         primeira_ob as quando
  from core.rastro_plano
  where transferido > 0
    and current_date - primeira_ob > 180
    and executado_relatorio is not null
    and executado_relatorio < 0.10 * transferido
