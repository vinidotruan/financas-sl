# Município analisado. Para outra cidade, troque estes campos e a lista de órgãos (docs/replicar.md).
nome: São Leopoldo
uf: RS
ibge: 4318705
cnpj_municipio: "89814693000160"
inicio: 2022-01-01

# Câmara de Vereadores: pedidos de providência e indicações, pelo JSON que o site da Câmara usa.
# São Leopoldo usa o Legiflow; o endereço da API aparece no próprio site (docs/replicar.md).
camara:
  sistema: legiflow
  api: https://api.camarasaoleopoldo.rs.gov.br
  site: https://www.camarasaoleopoldo.rs.gov.br

# Órgãos cujas compras entram no PNCP. CNPJs conferidos em 18/11/2026 no cadastro do PNCP
# (/api/pncp/v1/orgaos/{cnpj}/unidades): todas as unidades ficam em São Leopoldo.
orgaos_pncp:
  - cnpj: "89814693000160"
    nome: Prefeitura Municipal de São Leopoldo
  - cnpj: "92931245000150"
    nome: Fundação Hospital Centenário
  - cnpj: "50144885000170"
    nome: Fundação Municipal de Saúde de São Leopoldo
  - cnpj: "88368386000130"
    nome: SEMAE (Serviço Municipal de Água e Esgotos)
  - cnpj: "88369426000168"
    nome: Câmara Municipal de São Leopoldo

# Sem nenhuma unidade cadastrada no PNCP em 18/11/2026, então nunca publicaram nada lá.
